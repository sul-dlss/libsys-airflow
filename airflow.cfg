[core]
# auth_manager is deliberately not set here: this file is baked into the image, so
# it would apply to every environment built from it. Each compose file sets
# AIRFLOW__CORE__AUTH_MANAGER instead, which keeps the choice per-environment and
# lets local development fall back to SimpleAuthManager without a rebuild.
dags_folder = /opt/airflow/libsys_airflow/dags
plugins_folder = /opt/airflow/libsys_airflow/plugins

[logging]
logging_config_class = log_config.LOGGING_CONFIG
