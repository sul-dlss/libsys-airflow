<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
  </style>
</head>
<body>
  <h2>{{ title }}</h2>
{% if not reference_df.empty %}
   <p>
   <a href="?download=true">Download CSV</a>
   </p>
   {{ reference_df.to_html(index=False)|safe }}
{% else %}
    <ul id="ref-data-list">
        <li><a href="reference/loan_type">Loan Types</a></li>
        <li><a href="reference/material_type">Material Types</a></li>
        <li><a href="reference/locations">Locations</a></li>
        <li><a href="reference/patron_group">Patron Group</a></li>
    </ul>
{% endif %}
</body>
</html>
