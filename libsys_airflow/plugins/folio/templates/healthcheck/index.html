<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Health check</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .status-ok { color: #0f5132; font-weight: bold; }
    .status-fail { color: #842029; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Health check</h2>
  <ul>
      {% for status, passed in statuses.items() %}
      <li>
          <strong>{{ status }}: </strong>
          {% if passed %}
          <span class="status-ok">OK</span>
          {% else %}
          <span class="status-fail">FAIL</span>
          {% endif %}
      </li>
      {% endfor %}
  </ul>
</body>
</html>
