<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data Export MARC Downloads</title>
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.css" />
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.js"></script>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
  </style>
</head>
<body>
  <table id="marcDownloads">
    <thead>
      <tr>
        <th>Vendor</th>
        <th>State</th>
        <th>Status</th>
        <th>MARC file (download)</th>
      </tr>
    </thead>
    <tbody>
      {% for item in content %}
      <tr>
        <td>{{ item.vendor }}</td>
        <td>{{ item.state }}</td>
        <td>{{ item.kind }}</td>
        <td>
          <a class="{{ item.vendor }}-{{ item.state }}-{{ item.kind }}" href="downloads/{{ item.vendor }}/{{ item.state }}/{{ item.kind }}/{{ item.filename }}" download>{{ item.filename }}</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      new DataTable('#marcDownloads');
    });
  </script>
</body>
</html>
