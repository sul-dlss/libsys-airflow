{% extends "base.html" %}

{% block head_title %}Data Export CSV Upload{% endblock %}

{% block body %}
  <h2>Data Export CSV Upload</h2>
  {% for message in messages %}
  <div class="alert-message">{{ message }}</div>
  {% endfor %}
  <form enctype="multipart/form-data" method="POST" action="create">
    <div class="form-row">
      <label for="ids_file">Upload a csv file with a single column of instance UUIDs</label>
      <input type="file" id="ids_file" name="ids_file">
    </div>
    <div class="form-row">
      <label for="vendor">Select Export Vendor (required)</label>
      <select onchange="toggleRecordTypes()" id="vendor" name="vendor">
        <option value="">--Choose vendor--</option>
        {% for v in vendors %}
          <option value="{{ v }}">{{ v }}</option>
        {% endfor %}
      </select>
      <p>Select for New records, Updates or Deletes:</p>
      <fieldset id="kind">
          <input type="radio" name="kind" id="new" value="new" />
          <label for="new">New records</label>
          <input type="radio" name="kind" id="updates" value="updates" />
          <label for="updates">Updates</label>
          <input type="radio" name="kind" id="deletes" value="deletes" />
          <label for="deletes">Deletes</label>
      </fieldset>
    </div>
    <div class="form-row">
      <label for="user_email">Enter an email to receive upload confirmation:</label>
      <input type="email" id="user_email" name="user_email">
    </div>
    <button type="submit">Upload UUID file</button>
  </form>
{% endblock %}

{% block extra_scripts %}
  <script>
    function toggleRecordTypes() {
      const vendorSelect = document.getElementById("vendor");
      const vendor = vendorSelect.value;
      const radioButtons = document.querySelectorAll('input[type="radio"][name="kind"]');

      switch(vendor) {
        case "gobi":
        case "backstage":
          radioButtons.forEach(radio => {
            if (radio.value == "updates" || radio.value == "deletes") {
              radio.disabled = true;
              radio.checked = false;
            } else {
              radio.disabled = false;
              radio.checked = true;
            }
          });
          break;

        case "oclc":
          radioButtons.forEach(radio => {
            if (radio.value == "updates") {
              radio.disabled = true;
              radio.checked = false;
            } else {
              radio.disabled = false;
              radio.checked = false;
            }
          });
          break;

        default:
          radioButtons.forEach(radio => {
             radio.disabled = false;
             radio.checked = false;
          });
      }
    }
  </script>
{% endblock %}
