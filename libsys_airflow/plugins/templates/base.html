<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block head_title%}{% endblock %}</title>
    <style>
    body { font-family: sans-serif; margin: 2rem; }
    .alert-message { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; background: #fff3cd; color: #664d03; }
    .form-row { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; margin-top: 0.75rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    .columns { display: flex; gap: 2rem; }
    .column { flex: 1; }
    .list-item { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
