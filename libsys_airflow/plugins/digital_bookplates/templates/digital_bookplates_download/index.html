{% extends "base.html" %}

{% block head_title %}Digital Bookplates Downloads{% endblock %}

{% block extra_head %}
  {% include "_datatable.html" %}
{% endblock %}

{% block body %}
  <table id="csvDownloads" data-datatable>
    <thead>
      <tr>
        <th>Date</th>
        <th>CSV file download</th>
      </tr>
    </thead>
    <tbody>
      {% for item in content %}
        <tr>
            <td>
            {{ item['date'] }}
            </td>
            <td>
            <a id="{{ item['date'] }}" href="{{ item['year'] }}/{{ item['month'] }}/{{ item['day'] }}/{{ item['filename'] }}" download>{{ item['filename'] }}</a>
            </td>
        </tr>
      {% endfor %}
    </tbody>
    </table>
{% endblock %}
